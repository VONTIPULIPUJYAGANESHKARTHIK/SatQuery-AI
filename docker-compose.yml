services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_DB: satquery
      POSTGRES_USER: satquery_user
      POSTGRES_PASSWORD: satquery_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery_user -d satquery"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgis://satquery_user:satquery_password@db:5432/satquery
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
