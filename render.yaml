databases:
  # Managed PostgreSQL Database
  - name: satquery-postgres
    databaseName: satquery
    user: satquery_user
    plan: free

services:
  # Django Backend API with PostGIS (Docker runtime with GDAL/GEOS/PROJ)
  - type: web
    name: satquery-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: satquery-postgres
          property: connectionString

  # React + Vite Frontend Static Site
  - type: web
    name: satquery-frontend
    runtime: static
    rootDir: satqueryaifrontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    plan: free
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
